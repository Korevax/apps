name: Database Migration CI

on:
  pull_request:
    paths:
      - "api/db/**"
      - ".github/workflows/database-ci.yml"

permissions:
  contents: read

jobs:
  verify-postgres-migrations:
    name: Apply and test PostgreSQL migrations
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: korevax_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d korevax_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install --yes postgresql-client
      - name: Apply initial schema
        env:
          PGHOST: localhost
          PGPORT: 5432
          PGUSER: postgres
          PGPASSWORD: postgres
          PGDATABASE: korevax_test
        run: psql --set ON_ERROR_STOP=1 --file api/db/migrations/0001_initial_catalog.sql
      - name: Test schema constraints and collection rules
        env:
          PGHOST: localhost
          PGPORT: 5432
          PGUSER: postgres
          PGPASSWORD: postgres
          PGDATABASE: korevax_test
        run: psql --set ON_ERROR_STOP=1 --file api/db/tests/0001_initial_catalog.test.sql
